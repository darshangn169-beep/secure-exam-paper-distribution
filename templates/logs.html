{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Access &amp; Audit Logs</h4>
<a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary mb-3">← Back to Dashboard</a>

<table class="table table-bordered table-sm bg-white">
    <thead class="table-light">
        <tr><th>Time</th><th>Paper</th><th>Center</th><th>Status</th><th>Reason</th></tr>
    </thead>
    <tbody>
    {% for l in logs %}
        <tr class="{{ 'table-danger' if l.status == 'failure' else 'table-success' }}">
            <td>{{ l.timestamp }}</td>
            <td>{{ l.title }}</td>
            <td>{{ l.username }}</td>
            <td>{{ l.status }}</td>
            <td>{{ l.reason }}</td>
        </tr>
    {% else %}
        <tr><td colspan="5" class="text-center text-muted">No access attempts yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
